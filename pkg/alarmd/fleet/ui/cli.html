<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>alarmd CLI 授权</title>
<style>
body{font:16px/1.65 system-ui,sans-serif;color:#243247;background:#f4f6fa;margin:0;padding:32px}main{max-width:720px;margin:auto;background:#fff;padding:28px;border:1px solid #dce3ed;border-radius:10px}h1{margin-top:0;font-size:24px}p{margin:16px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f4f6fa;padding:12px}button{font:inherit;padding:8px 16px;cursor:pointer}button:disabled{cursor:default}textarea{box-sizing:border-box;width:100%;height:140px;font:13px monospace}#status{white-space:pre-wrap}.error{color:#a32525}label{display:block}a{color:#1769c2}
</style>
</head>
<body><main>
<h1>授权 alarmd CLI 读取此环境</h1>
<p>授权范围为本部署的运维只读取证，包括策略配置、运行证据和受限的 Redis 数据。输入本部署的管理凭据，核对环境后生成一次性授权码。</p>
<label for="admin-key">部署管理凭据</label>
<input id="admin-key" type="password" autocomplete="off" spellcheck="false" maxlength="256">
<button id="inspect">核对环境</button>
<pre id="preview" aria-live="polite">输入管理凭据后核对环境。</pre>
<button id="issue" disabled>生成授权码</button>
<section id="grant" hidden>
<p>在终端运行 <code>alarmd-cli auth login</code>，按提示粘贴下方授权码。授权码 5 分钟内有效且仅能兑换一次；不要放入聊天记录、工单或命令参数。</p>
<label for="code">一次性授权码</label><textarea id="code" readonly autocomplete="off" spellcheck="false"></textarea>
<button id="copy">复制授权码</button>
<p id="expiry"></p>
<p>会话有效期 1 小时。有效取证请求在剩余 10 分钟以内时续期；停止使用后自然失效。使用 <code>alarmd-cli auth logout --env 环境ID</code> 可提前撤销。</p>
</section>
<p id="status" role="status"></p>
<p><a id="back" href="./v2">返回可观测页面</a></p>
</main>
<script>
'use strict';
const base = new URL(location.href);
base.pathname = base.pathname.replace(/\/cli(?:\.html)?\/?$/, '/');
base.search = ''; base.hash = '';
const endpoint = new URL('api/cli/auth/grants', base);
document.getElementById('back').href = new URL('v2', base).href;
const status = document.getElementById('status');
const issue = document.getElementById('issue');
const code = document.getElementById('code');
const adminKey = document.getElementById('admin-key');
const inspect = document.getElementById('inspect');
const preview = document.getElementById('preview');
let revision = 0;
let expiryTimer;
let configuredEntry = '';
function message(text, error) { status.textContent = text; status.className = error ? 'error' : ''; }
// What to do, for each way the grant route can refuse. The server's own
// sentence is English and says what went wrong; the operator reading this
// page needs where to look, so every code the route can return has a line.
function wrongEntry(configured) {
  return `当前页面地址 ${location.origin} 与 alarmd 配置的入口 ${configured} 不一致，授权码生成会被拒绝。`
    + `请从 ${configured}cli 打开本页；如果入口地址已经变了，把 values 里的 alarmd.cli.publicBaseUrl（即配置里的 cli.public_base_url）改成新的入口地址（末尾带 /）后重新部署。`;
}
const HINTS = {
  admin_unauthorized: '管理凭据不对：请输入部署时写进 Secret 的那个值（values 里 alarmd.cli.adminKeySecret.existingSecret 指向的 Secret）。',
  admin_not_configured: 'alarmd 没有拿到管理凭据，签发未开启：检查 values 里 alarmd.cli.adminKeySecret.existingSecret，以及该 Secret 是否在 alarmd 所在的命名空间、键名是否对，改完重新部署。',
  origin_denied: '',
  auth_rate_limited: '生成得太频繁：每个副本每分钟最多 6 次，请下一分钟再试。',
  auth_busy: '授权服务正忙，请几秒后重试。',
  auth_store_unavailable: 'alarmd 读写授权记录的运行 Redis 暂不可用，请稍后重试；持续失败请检查 alarmd 的运行 Redis。',
  not_found: 'alarmd 没有开启 CLI，或入口没有把 /api/cli/ 转发到 alarmd：确认镜像版本、values 的 alarmd.cli 段，以及 Ingress 按前缀整体转发。',
  unreachable: '授权接口没有返回 alarmd 的应答：入口没有把 /api/cli/ 转发到 alarmd，或 alarmd 没有开启 CLI。确认 Ingress 按前缀整体转发、不加登录认证，以及 values 的 alarmd.cli 段。'
};
function hint(code, fallback) {
  if (code === 'origin_denied') return wrongEntry(configuredEntry || '（未知，请先点"核对环境"）');
  return HINTS[code] || fallback || '授权服务暂不可用，请检查管理凭据与部署配置。';
}
function clearCode() { code.value = ''; document.getElementById('grant').hidden = true; clearTimeout(expiryTimer); }
async function request(method, key) {
  let response, value;
  try {
    response = await fetch(endpoint, {method, credentials:'omit', cache:'no-store', redirect:'error', headers:{'Authorization':'Bearer '+key, ...(method==='POST'?{'Content-Type':'application/json'}:{})}, body:method==='POST'?JSON.stringify({confirm:true}):undefined});
    value = await response.json();
  } catch (_) {
    // A redirect, a network failure or a body that is not JSON: whatever
    // answered was not alarmd's grant route.
    throw new Error(hint('unreachable'));
  }
  if (!response.ok) throw new Error(hint(value.error?.code, value.error?.message));
  return value;
}
adminKey.addEventListener('input', () => { revision++; issue.disabled = true; preview.textContent = '请重新核对环境。'; clearCode(); });
inspect.addEventListener('click', async () => {
  const currentRevision = revision;
  if (!adminKey.value) { message('请输入部署管理凭据。', true); return; }
  inspect.disabled = true; issue.disabled = true; clearCode();
  try {
    const value = await request('GET', adminKey.value);
    if (currentRevision !== revision) return;
    preview.textContent = `环境：${value.environment_name} (${value.environment_id})\n入口：${value.public_base_url}\n权限：部署级运维只读取证`;
    configuredEntry = new URL(value.public_base_url).origin + new URL(value.public_base_url).pathname;
    // Generation checks that this page's origin is the configured entry's.
    // Said here, before the button, rather than as a refusal after it.
    if (new URL(value.public_base_url).origin !== location.origin) {
      issue.disabled = true; message(wrongEntry(configuredEntry), true); return;
    }
    issue.disabled = false; message('请确认上述环境，再生成授权码。', false);
  } catch (error) {
    if (currentRevision !== revision) return;
    adminKey.value = ''; preview.textContent = '尚未获得授权环境信息。'; message(error.message, true);
  } finally { inspect.disabled = false; }
});
issue.addEventListener('click', async () => {
  const currentRevision = revision;
  issue.disabled = true; inspect.disabled = true; adminKey.disabled = true; clearCode(); message('正在生成…', false);
  try {
    const value = await request('POST', adminKey.value);
    if (currentRevision !== revision) return;
    code.value = value.authorization_code;
    document.getElementById('grant').hidden = false;
    document.getElementById('expiry').textContent = `兑换截止时间：${new Date(value.grant_expires_at).toLocaleString()}；环境：${value.environment_id}`;
    expiryTimer = setTimeout(() => { clearCode(); message('授权码已到期，可以重新生成。', false); }, Math.max(0, new Date(value.grant_expires_at).getTime()-Date.now()));
    message('授权码已生成。', false);
  } catch (error) { if (currentRevision === revision) message(error.message, true); }
  finally { adminKey.value = ''; adminKey.disabled = false; inspect.disabled = false; issue.disabled = true; }
});
document.getElementById('copy').addEventListener('click', async () => {
  try { await navigator.clipboard.writeText(code.value); message('已复制，请粘贴到 CLI 登录提示中。', false); }
  catch (_) { code.focus(); code.select(); message('浏览器无法直接复制，已选中授权码，请手动复制。', false); }
});
addEventListener('pagehide', () => { revision++; adminKey.value = ''; issue.disabled = true; clearCode(); });
</script></body></html>
